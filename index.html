<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Midnight Byte V1 Beta</title>
<style>
body{background:#050510;color:#fff;font-family:Arial,sans-serif;margin:0;padding:20px}
h1{color:#ff4fd8;text-shadow:0 0 20px #ff4fd8}
.card{border:1px solid #7ad7ff;padding:16px;border-radius:12px;max-width:800px;margin:auto}
button{padding:10px 16px;margin:5px;border:1px solid #7ad7ff;background:#111;color:white;border-radius:8px}
.small{color:#7ad7ff}
</style>
</head>
<body>
<div class="card">
<h1>MIDNIGHT BYTE</h1>
<p class="small">Late Night Mission Control</p>
<p>STATUS : ONLINE</p>
<p>MISSION : FIND FOOD</p>
<p>USER_01 : Nicole<br>USER_02 : Allen</p>

<button onclick="startScan()">START SCAN</button>
<button onclick="showArchive()">MISSION ARCHIVE</button>

<div id="app"></div>
</div>

<script>
const cookieMsgs=[
"COOKIE STATUS : Sleeping...",
"COOKIE STATUS : Requesting Chicken...",
"COOKIE STATUS : Searching For Treats..."
];

const archive=JSON.parse(localStorage.getItem("mb_archive")||"[]");

function startScan(){
document.getElementById("app").innerHTML=`
<h2>Q1 今天有多累？</h2>
<button onclick="q2('dead')">😵 快死了</button>
<button onclick="q2('normal')">😐 還好</button>
<button onclick="q2('good')">😎 很有精神</button>`;
}

let answers={};

function q2(v){
answers.energy=v;
document.getElementById("app").innerHTML=`
<h2>Q2 現在在做什麼？</h2>
<button onclick="q3('movie')">🎬 看電影</button>
<button onclick="q3('game')">🎮 打遊戲</button>
<button onclick="q3('phone')">📱 滑手機</button>
<button onclick="q3('work')">💻 工作</button>
<button onclick="q3('yt')">📺 看 YouTube</button>`;
}

function q3(v){
answers.activity=v;
document.getElementById("app").innerHTML=`
<h2>Q3 今晚模式？</h2>
<button onclick="q4('diet')">😇 克制一下</button>
<button onclick="q4('normal')">😎 正常</button>
<button onclick="q4('free')">😈 放飛自我</button>`;
}

function q4(v){
answers.mode=v;
document.getElementById("app").innerHTML=`
<h2>Q4 行動模式？</h2>
<button onclick="result('home')">🏠 不想出門</button>
<button onclick="result('delivery')">🛵 外送</button>
<button onclick="result('drive')">🚗 可以開車</button>`;
}

function result(v){
answers.transport=v;
let main="🍗 炸雞";
let stores="胖老爹、拿坡里炸雞、肯德基";
let drink="🧋 珍珠奶茶";
let dessert="🍰 卡士達泡芙";
let reason="放飛自我模式";

if(answers.mode==="diet"){
main="🍣 生魚片"; stores="爭鮮、藏壽司"; drink="🍵 無糖茶"; dessert="🍮 布丁"; reason="克制模式";
}

document.getElementById("app").innerHTML=`
<h2>MISSION RESULT</h2>
<h3>TOP 1</h3>
<p><b>主餐</b><br>${main}</p>
<p><b>推薦店家</b><br>${stores}</p>
<p><b>飲料</b><br>${drink}</p>
<p><b>第二胃</b><br>${dessert}</p>
<p><b>推薦原因</b><br>${reason}</p>
<button onclick="acceptMission('${main}')">ACCEPT MISSION</button>
<button onclick="window.open('https://www.ubereats.com','_blank')">Uber Eats</button>
<button onclick="window.open('https://www.foodpanda.com.tw','_blank')">Foodpanda</button>
<p>${cookieMsgs[Math.floor(Math.random()*cookieMsgs.length)]}</p>`;
}

function acceptMission(main){
const item={date:new Date().toISOString().slice(0,10),main:main,activity:answers.activity};
archive.unshift(item);
localStorage.setItem("mb_archive",JSON.stringify(archive));
alert("Mission Saved!");
}

function showArchive(){
let html="<h2>MISSION ARCHIVE</h2>";
if(!archive.length){html+="<p>尚無紀錄</p>";}
archive.forEach(a=>{
html+=`<div><p>${a.date}<br>${a.main}<br>${a.activity}</p><hr></div>`;
});
document.getElementById("app").innerHTML=html;
}
</script>
</body>
</html>
