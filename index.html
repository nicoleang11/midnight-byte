<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Midnight Byte</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050510;
    color:white;
    font-family:Arial, sans-serif;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* 背景霓虹光 */

body::before{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:radial-gradient(circle,
    rgba(255,0,180,0.25),
    transparent 70%);
    top:-200px;
    left:-200px;
}

body::after{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    background:radial-gradient(circle,
    rgba(0,200,255,0.25),
    transparent 70%);
    bottom:-200px;
    right:-200px;
}

/* 掃描線 */

.scanline{
    position:fixed;
    width:100%;
    height:2px;
    background:rgba(255,255,255,0.15);
    animation:scan 5s linear infinite;
}

@keyframes scan{
    from{
        top:-10px;
    }
    to{
        top:100%;
    }
}

.container{
    text-align:center;
    z-index:10;
}

h1{
    font-size:4rem;
    color:#ff4fd8;
    text-shadow:
    0 0 10px #ff4fd8,
    0 0 20px #ff4fd8,
    0 0 40px #ff4fd8;
    margin-bottom:20px;
}

.subtitle{
    color:#7ad7ff;
    font-size:1.2rem;
    margin-bottom:40px;
}

.info{
    margin:10px 0;
    color:#d9d9d9;
    letter-spacing:2px;
}

button{
    margin-top:40px;
    padding:18px 45px;
    background:transparent;
    color:#fff;
    border:2px solid #7ad7ff;
    border-radius:12px;
    cursor:pointer;
    font-size:1.1rem;
    letter-spacing:2px;
    transition:0.3s;
}

button:hover{
    box-shadow:
    0 0 10px #7ad7ff,
    0 0 20px #7ad7ff,
    0 0 40px #7ad7ff;
    transform:scale(1.05);
}

.status{
    color:#00ff99;
}

</style>
</head>

<body>

<div class="scanline"></div>

<div class="container">

<h1>MIDNIGHT BYTE</h1>

<div class="subtitle">
Late Night Mission Control
</div>

<div class="info">
USER_01 : Nicole
</div>

<div class="info">
USER_02 : Allen
</div>

<div class="info status">
STATUS : ONLINE
</div>

<div class="info">
MISSION : FIND FOOD
</div>

<button onclick="startScan()">
START SCAN
</button>

</div>

<script>

function startScan(){

document.querySelector(".container").innerHTML = `

<h1>SYSTEM SCAN</h1>

<div class="subtitle">
Question 01
</div>

<div class="info">
今天有多累？
</div>

<br><br>

<button>😵 快死了</button>

<br><br>

<button>😐 還好</button>

<br><br>

<button>😎 很有精神</button>

`;

}

</script></body>
</html>
